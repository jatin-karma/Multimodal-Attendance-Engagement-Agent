<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduSense AI — Privacy-Preserving Classroom Intelligence System">
    <title>EduSense AI | Classroom Intelligence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <nav class="navbar" id="top-navbar">
        <div class="nav-brand">
            <span class="brand-sparkle">✨</span>
            <div class="brand-text">
                <span class="nav-title">EduSense AI</span>
                <span class="nav-subtitle">Classroom Intelligence</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="javascript:void(0)" onclick="if(window.switchView) window.switchView('classroom')" class="nav-link active" id="nav-dash-link">Live Classroom</a>
            <a href="javascript:void(0)" onclick="if(window.switchView) window.switchView('teacher-central')" class="nav-link" id="nav-teacher-link">Teacher Central</a>
            <a href="/" class="nav-link">Home</a>
        </div>
    </nav>

    <main class="main-content-fluid">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
